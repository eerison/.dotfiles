- name: Check dependencies on Arch
  become: yes
  community.general.pacman:
    name:
      - php
      - git
      - nodejs
      - npm
    state: present
  when: ansible_facts['os_family'] == 'Archlinux'
  tags: ['php', 'arch']

- name: Check dependencies on Debian
  become: yes
  ansible.builtin.apt:
    name:
      - php
      - git
      - nodejs
    state: present
  when: ansible_facts['os_family'] == 'Debian'
  tags: ['php', 'debian']

